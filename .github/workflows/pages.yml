name: Deploy antarmuka ke GitHub Pages

# Hanya isi frontend/ yang diterbitkan. Sisa repositori — notebook, backend,
# skrip training, dataset — tetap bisa dibaca lewat halaman repo, tetapi tidak
# ikut disajikan sebagai situs.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Satu penerbitan pada satu waktu. cancel-in-progress sengaja false: menghentikan
# deploy di tengah jalan bisa meninggalkan situs dalam keadaan setengah terbit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - id: deployment
        uses: actions/deploy-pages@v4
